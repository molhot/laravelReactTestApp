version: "3.9"

services:
  # MySQL
  db:
    image: mysql:8.0
    container_name: appMysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel
      MYSQL_USER: maria
      MYSQL_PASSWORD: 1a24c3de
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"

  # Laravel + Apache + PHP
  backend:
    build:
      context: ./apache
      dockerfile: Dockerfile
    container_name: appBackend
    depends_on:
      - db
    volumes:
      - ./laravel:/var/www/html
    ports:
      - "8887:80"   # Apacheのポートをホスト8080へ
    environment:
      DB_CONNECTION=mysql
      DB_HOST=db
      DB_PORT=3306
      DB_DATABASE=laravel
      DB_USERNAME=marimo
      DB_PASSWORD=1a24c3de

  # React (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: appFrontend
    volumes:
      - ./frontend:/app
    ports:
      - "3001:5173"
    command: sh -c "npm run dev -- --host 0.0.0.0 --port 3000"
    depends_on:
      - backend

volumes:
  db_data:
